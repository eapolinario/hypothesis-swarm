[project]
name = "hypothesis-swarm"
version = "0.1.0"
description = "Swarm testing for Hypothesis — randomly disables a subset of your @rules per test case to find bugs uniform random testing misses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Apolinario" }]
keywords = ["hypothesis", "testing", "property-based-testing", "swarm-testing", "fuzzing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.entry-points.pytest11]
hypothesis_swarm = "hypothesis_swarm.pytest_plugin"

[project.urls]
Repository = "https://github.com/eapolinario/hypothesis-swarm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypothesis_swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
